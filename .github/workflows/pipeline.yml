# Pruebas de la metodología del pipeline (sin descargar fuentes).
name: Pipeline

on:
  push:
    paths: ["pipeline/**", ".github/workflows/pipeline.yml"]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q
