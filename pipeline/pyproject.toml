[project]
name = "iica"
version = "0.1.0"
description = "Indicadores parciales del Indice de Inteligencia Civica Aumentada (IICA)"
authors = [
    { name = "juliowaissman", email = "julio.waissman@unison.mx" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bibtexparser>=2.1.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pyreadr>=0.5.9",
    "pyreadstat>=1.3.7",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
iica = "iica.cli:main"
