id: osc
nombre: Registro Federal de las Organizaciones de la Sociedad Civil (CLUNI), listado de OSC con estatus
editor: Secretaría de Bienestar, Comisión de Fomento de las Actividades de las Organizaciones de la Sociedad Civil (antes Indesol)
url: http://corresponsabilidad.gob.mx/index.php/consulta/guia-para-consultar-el-listado-de-osc-inscritas-con-objeto-social
licencia: Sin licencia declarada
redistribuible: false
cita: bienestar_rfosc_2025
niveles: [nacional, estatal]
descarga: automatica
estado: verificada
motivo: >-
  Los sitios corresponsabilidad.gob.mx y sii.bienestar.gob.mx no respondieron desde nuestra red
  (noviembre de 2026); los enlaces a las hojas de Google se obtuvieron de la copia de web.archive.org
  de la guía (captura del 13 de mayo de 2026) y se descargan directamente. Si dejan de funcionar,
  consultar el "Buscador de OSC" en https://sii.bienestar.gob.mx/portal/ filtrando por "Estatus de
  la OSC" y exportar el listado. El archivo incluye correos de contacto de las organizaciones.
indicadores:
  - id: osc_activas
    nombre: OSC con CLUNI en estatus ACTIVA
    dimension: 2
    capa: instalada
    sentido: 1
    transformacion: por_100k
    unidad: organizaciones (conteo absoluto)
    nota: >-
      CLUNI únicos con ESTATUS OSC = ACTIVA, por ENTIDAD (domicilio legal). Cortes al 31 de diciembre
      de 2024 y de 2025 (anio = año del corte). Una OSC es activa si presentó sus informes anuales.
  - id: osc_activas_y_condicionadas
    nombre: OSC con CLUNI en estatus ACTIVA o ACTIVA CONDICIONADA
    dimension: 2
    capa: instalada
    sentido: 1
    unidad: organizaciones (conteo absoluto)
    nota: Incluye el estatus ACTIVA CONDICIONADA, que el registro trata por separado.
