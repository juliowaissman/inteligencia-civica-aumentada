motivo: >-
  195 gobiernos. Los PDF del informe y de "Index Data" se entregan tras un formulario de registro,
  pero los puntajes por país (total, 6 pilares y 14 dimensiones) están incrustados como JSON en la
  página pública del índice, de donde se leen tal cual; por eso no hace falta descarga manual.
  Las ediciones 2019–2024 usan otra estructura (3 pilares) y no se mezclan con la de 2025.
  Códigos ISO2 convertidos a ISO3 con GeoNames (CC BY 4.0).
